name: Build Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install rmkit 0.0.21 (RMK 0.9)
        run: cargo install rmkit --version 0.0.21

      - name: Build firmware
        run: rmkit build --keyboard-toml-path keyboard.toml

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./target/**/*.uf2
