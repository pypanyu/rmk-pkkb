name: Build Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install rmkit v0.0.21
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/HaoboGu/rmkit/releases/download/v0.0.21/rmkit-installer.sh | sh

      - name: Generate RMK project (lock RMK v0.9.0 template)
        run: |
          RUST_BACKTRACE=1 rmkit create \
            --keyboard-toml-path keyboard.toml \
            --vial-json-path vial.json \
            --target-dir ./firmware_proj \
            --template-rev v0.9.0

      - name: Build firmware
        run: |
          cd ./firmware_proj
          cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./firmware_proj/target/**/*.uf2

