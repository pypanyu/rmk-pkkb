name: Build Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      # 使用官方脚本安装rmkit v0.0.21（避免crates.io网络问题）
      - name: Install rmkit v0.0.21
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/HaoboGu/rmkit/releases/download/v0.0.21/rmkit-installer.sh | sh

      # 1. 根据toml生成完整固件项目，输出目录 ./firmware_proj
      - name: Generate RMK project
        run: rmkit create --keyboard-toml-path keyboard.toml --vial-json-path vial.json --target-dir ./firmware_proj

      # 2. 进入项目目录编译
      - name: Build firmware
        run: |
          cd ./firmware_proj
          cargo build --release

      # 上传生成的uf2固件
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./firmware_proj/target/**/*.uf2
