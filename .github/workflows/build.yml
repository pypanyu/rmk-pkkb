name: Build RMK RP2040 Split Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4
        with:
          path: projects/repo

      - name: Checkout RMK dependency
        uses: actions/checkout@v4
        with:
          repository: rmk-rs/rmk
          path: rmk

      - name: Cache cargo registry and git index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('projects/repo/rp2040_split/Cargo.toml', 'projects/repo/rp2040_split/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup component add llvm-tools-preview
          rustup target add thumbv6m-none-eabi

      - name: Install build helpers
        run: |
          cargo install --locked cargo-binutils flip-link cargo-hex-to-uf2

      - name: Build central firmware
        working-directory: projects/repo/rp2040_split
        run: cargo build --release --bin central --target thumbv6m-none-eabi

      - name: Build peripheral firmware
        working-directory: projects/repo/rp2040_split
        run: cargo build --release --bin peripheral --target thumbv6m-none-eabi

      - name: Create central HEX
        working-directory: projects/repo/rp2040_split
        run: cargo objcopy --release --bin central -- --output-target ihex rmk-central.hex

      - name: Create peripheral HEX
        working-directory: projects/repo/rp2040_split
        run: cargo objcopy --release --bin peripheral -- --output-target ihex rmk-peripheral.hex

      - name: Create central UF2
        working-directory: projects/repo/rp2040_split
        run: cargo hex-to-uf2 --input-path rmk-central.hex --output-path rmk-central.uf2 --family rp2040

      - name: Create peripheral UF2
        working-directory: projects/repo/rp2040_split
        run: cargo hex-to-uf2 --input-path rmk-peripheral.hex --output-path rmk-peripheral.uf2 --family rp2040

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmk-firmware
          path: |
            projects/repo/rp2040_split/rmk-central.hex
            projects/repo/rp2040_split/rmk-peripheral.hex
            projects/repo/rp2040_split/rmk-central.uf2
            projects/repo/rp2040_split/rmk-peripheral.uf2
