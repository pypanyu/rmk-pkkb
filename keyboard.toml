#Documentation: https://rmk.rs/docs/configuration.html
#
# Toykit v2 — BLE split keyboard WITH a USB dongle + bongocat OLED.
#
# Architecture after adding the dongle:
#   * dongle  = split central : plugged into the PC over USB, talks BLE to the
#               two keyboard halves, and drives the little OLED showing bongocat.
#               It has NO physical keys — every key comes from the two halves.
#   * left half  (was the old central) = peripheral 0  (col_offset 0)
#   * right half (was the old peripheral) = peripheral 1 (col_offset 5)
#
# Firmware images: `central` (the dongle), `peripheral` (left half),
# `peripheral2` (right half).

[keyboard]
name = "Toykit v2 Dongle"
product_name = "Toykit v2 Dongle"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "nrf52840"

[layout]
rows = 4
cols = 10
layers = 8
keymap = [
    [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Enter"],
        ["Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Delete"],
        ["LCtrl", "_", "LShift", "Space", "_",  "_", "LT(2, Space)", "RAlt", "_", "Delete" ]
    ]
 ]

[rmk]
combo_max_num = 32
combo_max_length = 4
debounce_time = 5
morse_max_num = 32
max_patterns_per_key = 4
# Tell RMK there are two peripherals connecting to the dongle (central).
split_peripherals_num = 2

[host]
vial_enabled = true
unlock_keys = [[0, 0], [0, 1]]

[ble]
enabled = true
battery_adc_pin = "vddh"

[storage]
enabled = true
clear_storage = true

[split]
connection = "ble"

# ---------------------------------------------------------------------------
# Dongle = split central.
# It connects to the host via USB and to the two halves via BLE.
# It is keyless: rows/cols = 0, with an empty direct-pin matrix so RMK gets a
# valid (zero-size) central matrix. All keys arrive from the peripherals below.
# If your RMK build rejects a 0x0 central matrix, switch to a 1x1 dummy
# `direct_pin` matrix using any free GPIO on the dongle board.
# ---------------------------------------------------------------------------
[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pins = []

# Small OLED on the dongle, driven by the custom bongocat renderer.
[split.central.display]
driver = "ssd1306"
size = "128x64"
rotation = 0
# Full Rust path to our renderer (defined in src/bongocat.rs, exported by src/lib.rs).
renderer = "toykit_dongle::BongoCatRenderer"
# Redraw periodically so the cat can idle-animate; coalesce fast key events.
render_interval = 40
min_render_interval = 10
[split.central.display.protocol.i2c]
instance = "TWISPI0"
scl = "P0_17"
sda = "P0_20"

# Left half becomes peripheral 0 (originally the central half).
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
[split.peripheral.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P1_06", "P0_02", "P0_29", "P0_31"]

# Right half becomes peripheral 1 (originally the peripheral half).
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
[split.peripheral.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P1_06", "P0_02", "P0_29", "P0_31"]
