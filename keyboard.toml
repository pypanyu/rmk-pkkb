[keyboard]
name = "Stagger"
product_name = "Stagger"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "pkk"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_21", "PIN_23", "PIN_20", "PIN_22", "PIN_26", "PIN_27", "PIN_28", "PIN_29", "PIN_1"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`

[layout]
rows = 4
cols = 13
map = """
(0,0) (0,1) (0,2) [2.25] (0,3)(0,4)(0,5) (0,6) (0,7) (0,8) (0,9)(0,10)(0,11)(0,12)
(1,0) (1,1) (1,2) [2.25](1,3) (1,4) (1,5) (1,6) (1,7) (1,8) (1,9)(1,10)(1,11)(1,12)
(2,0) (2,1) (2,2) [2.25](2,3) (2,4) (2,5) (2,6) (2,7) (2,8) (2,9)(2,10)(2,11)(2,12)
           [1.75] (3,2)[3.25](3,5)(3,6)(3,8)(3,10)
"""

[keymap]
layers = 8
[[keymap.layer]]
keys = """
1 2 3 Q W E R T Y U I O P
4 5 6 A S D F G H J K L Enter
7 8 9 Z X C V B N M Comma Dot Delete
0  LShift Space LT(2, Space) RAlt
"""

[[keymap.layer]]
keys = """
_ _ _ 1 2 3 4 5 6 7 8 9 0
_ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _
"""
  

[rmk]
# Maximum number of combos keyboard can store
combo_max_num = 25
# Maximum number of keys pressed simultaneously in a combo
combo_max_length = 4
# Default debounce time in milliseconds  
debounce_time = 5
morse_max_num = 32
max_patterns_per_key = 8

[host]
# Enable or disable Vial support (default: true)
vial_enabled = true
insecure=true

# Unlock keys for Vial security (optional)
# Keys must be pressed simultaneously to unlock Vial configuration
# unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

[storage]
# Storage feature is enabled by default

