[keyboard]
name = "haori36rmk"
product_name = "haori36rmk"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "pkk"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_12", "PIN_13", "PIN_14", "PIN_15"]
col_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`

[layout]
rows = 4
cols = 10
map = """
(0,0) (0,1) (0,2) (0,3) (0,4) [1.5] (0,5) (0,6) (0,7) (0,8) (0,9)
(1,0) (1,1) (1,2) (1,3) (1,4) [1.5] (1,5) (1,6) (1,7) (1,8) (1,9)
(2,0) (2,1) (2,2) (2,3) (2,4) [1.5] (2,5) (2,6) (2,7) (2,8) (2,9)
           (3,2) (3,3) (3,4) [1.5] (3,5) (3,6) (3,7)
"""

[keymap]
layers = 8
[[keymap.layer]]
keys = """
Q W E R T Y U I O P
A S D F G H J K L Enter
Z X C V B N M Comma Dot Delete
LAlt LShift Space LT(2, Space) RAlt Left
"""

[[keymap.layer]]
keys = """
1 2 3 4 5 6 7 8 9 0
_ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _
"""
  

[rmk]
# Maximum number of combos keyboard can store
combo_max_num = 25
# Maximum number of keys pressed simultaneously in a combo
combo_max_length = 4
# Default debounce time in milliseconds  
debounce_time = 5
morse_max_num = 32
max_patterns_per_key = 8

[host]
# Enable or disable Vial support (default: true)
vial_enabled = true

# Unlock keys for Vial security (optional)
# Keys must be pressed simultaneously to unlock Vial configuration
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

[storage]
# Storage feature is enabled by default
enabled = true
