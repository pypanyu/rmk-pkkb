 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Orbit34"
product_name = "Orbit34"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "rp2040"

[keyboard]
name = "RMK Split GPIO Keyboard"
product_name = "RMK Split GPIO Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "haobo"
chip = "rp2040"

[split]
connection = "serial"

# =====================================================
# CENTRAL (LEFT HALF)
# =====================================================
[split.central]

serial = [
  { instance = "UART0", tx_pin = "GP0", rx_pin = "GP1" },
]

# GPIO direct keys (no matrix)
keys = [
  "D3",   # SW11 (DATA / key)
  "D0",   # SW1
  "D4",   # SW2
  "D1",   # SW6
  "C6",   # SW7
  "D7",   # SW12
  "E6",   # SW15
  "B4",   # SW16
  "B5",   # SW17
]

# =====================================================
# PERIPHERAL (RIGHT HALF)
# =====================================================
[[split.peripheral]]

serial = [
  { instance = "UART0", tx_pin = "GP1", rx_pin = "GP0" },
]

keys = [
  "F4",   # SW3
  "F6",   # SW8
  "F6",   # SW13 ⚠ 保留同脚，但已标记为共享（需硬件确认）
  "F7",   # SW4
  "B3",   # SW9
  "B1",   # SW14
  "B2",   # SW5
  "B6",   # SW10
]
