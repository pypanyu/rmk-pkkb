 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Orbit34"
product_name = "Orbit34"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [
    { instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_0" },
    { instance = "PIO1", tx_pin = "PIN_4", rx_pin = "PIN_5" },
]
[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_0", "PIN_1", "PIN_2"],
    ["PIN_3", "PIN_4", "PIN_5"],
    ["PIN_6", "_", "_"],
    ["PIN_9", "PIN_10", "_"],
]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 2
cols = 1
row_offset = 2
col_offset = 2
serial = [{ instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_0" }]
[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["PIN_9", "PIN_11"]
col_pins = ["PIN_10"]
bootmagic = [0, 0]

[layout]
rows = 4
cols = 5
layers = 8
keymap = [
    [
        ["A", "B", "C"],
        ["Kc1", "Kc2", "Kc3"],
        ["LCtrl", "_", "_"],
        ["OSL(1)", "LT(2, Kc9)", "_"]
    ],
    [
        ["_", "TT(1)", "TG(2)"],
        ["_", "_", "_"],
        ["_", "_", "_"],
        ["_", "_", "_"]
    ],
]

