 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Orbit34"
product_name = "Orbit34"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_10", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]
    
[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_10", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

# 三元层：同时按住 Lower(层1) 与 Raise(层2) 时自动叠加进入层3(Adjust)
[behavior]
tri_layer = { lower = 1, upper = 2, adjust = 3 }

[layout]
# RMK split 约定：rows/cols 为整把键盘的总行列数（左半5列 + 右半5列 = 10）
rows = 4
cols = 10
layers = 8
# 层索引 = keymap 数组下标。左半区占 col 0-4，右半区占 col 5-9。
keymap = [
    # ===== Layer 0: Base (QWERTY) =====
    # 左拇指(col3)= LT(1,LShift) 进 Lower；右拇指(col5)= LT(2,Space) 进 Raise
    [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Enter"],
        ["Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Delete"],
        ["_", "_", "_", "LT(1, LShift)", "Space", "LT(2, Space)", "RAlt", "_"],
    ],
    # ===== Layer 1: Lower (数字 + 常用符号) =====
    [
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"],
        ["Exclaim", "At", "Hash", "Dollar", "Percent", "Caret", "Ampersand", "Asterisk", "LParen", "RParen"],
        ["Minus", "Underscore", "Plus", "Equal", "LBracket", "RBracket", "Backslash", "Semicolon", "Colon", "Backspace"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_"],
    ],
    # ===== Layer 2: Raise (标点 + 括号) =====
    [
        ["Grave", "Tilde", "Exclaim", "At", "Hash", "Dollar", "Percent", "Caret", "Ampersand", "Asterisk"],
        ["LParen", "RParen", "LBracket", "RBracket", "LBrace", "RBrace", "Minus", "Underscore", "Equal", "Plus"],
        ["Semicolon", "Colon", "Quote", "DoubleQuote", "Comma", "Slash", "Backslash", "Question", "Pipe", "Backspace"],
        ["_", "_", "_", "LShift", "Space", "_", "RAlt", "_"],
    ],
    # ===== Layer 3: Adjust (系统 / 蓝牙 / 输出切换) =====
    # 由 tri-layer 自动进入，也可手动 TO(3)
    [
        ["BT0", "BT1", "BT2", "NEXT_BT", "PREV_BT", "CLR_BT", "SWITCH", "_", "_", "_"],
        ["TO(0)", "MO(1)", "MO(2)", "MO(4)", "MO(5)", "MO(6)", "MO(7)", "_", "_", "_"],
        ["Reset", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "TO(0)", "RAlt", "_"],
    ],
    # ===== Layer 4: Nav (方向 + 编辑移动) =====
    [
        ["Home", "PgUp", "PgDn", "End", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "Left", "Down", "Up", "Right", "Enter"],
        ["_", "_", "_", "_", "_", "Delete", "Insert", "Backspace", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_"],
    ],
    # ===== Layer 5: Mouse & Media =====
    [
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["MouseBtn1", "MouseUp", "MouseBtn2", "MouseWheelUp", "_", "MediaPrevTrack", "MediaVolDown", "MediaVolUp", "MediaNextTrack", "MediaPlayPause"],
        ["MouseLeft", "MouseDown", "MouseRight", "MouseWheelDown", "_", "MediaMute", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_"],
    ],
    # ===== Layer 6: Function (F1 - F12) =====
    [
        ["Esc", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9"],
        ["Grave", "F10", "F11", "F12", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_"],
    ],
    # ===== Layer 7: Extras (补充符号) =====
    [
        ["Grave", "Tilde", "LParen", "RParen", "LBracket", "RBracket", "LBrace", "RBrace", "LessThan", "GreaterThan"],
        ["At", "Hash", "Dollar", "Percent", "Caret", "Ampersand", "Asterisk", "Minus", "Underscore", "_"],
        ["Plus", "Equal", "Backslash", "Pipe", "Slash", "Question", "Semicolon", "Colon", "Quote", "DoubleQuote"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_"],
    ],
]
