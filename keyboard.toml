 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Orbit34"
product_name = "Orbit34"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_10", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]
    
[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_10", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

[layout]
rows = 4
cols = 5
layers = 8
keymap = [
    [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "ENTER"],
        ["Z", "X", "C", "V", "B", "N", "M","Comma", "Dot", "Delete"],
        ["_", "_",  "_", "LShift", "Space", "LT(2, Space)", "RAlt", "_",  "_"]
    ],
]

