[rmk]
combo_max_num = 25
combo_max_length = 4
debounce_time = 5
morse_max_num = 32
max_patterns_per_key = 4
macro_space_size = 1024

[ble]
enabled = true
battery_adc_pin = "vddh"

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P1_06", "P0_02", "P0_29", "P0_31"]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
