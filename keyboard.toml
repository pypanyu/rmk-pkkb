#Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Toykit v2"
product_name = "Toykit v2"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "nrf52840"


[layouts.WKL]
rows = 4
cols = 10
layers = 8
# For safety, use the same keymap as the default layout; users can edit per-layout keymaps in Vial.
keymap = [
    [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Enter"],
        ["Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Delete"],
        ["LCtrl", "_", "LShift", "Space", "_",  "_", "LT(2, Space)", "RAlt", "_", "Delete" ]
    ]
 ]
    
[layouts.HHKB]
rows = 4
cols = 10
layers = 8
# Duplicate keymap for HHKB variant. Adjustments can be made later if you want different physical bottom-row mapping.
keymap = [
   [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Enter"],
        ["Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Delete"],
        [ "_", "_", "_", "LShift", "Space", "LT(2, Space)", "RAlt", "_", "_", "_", ]
    ]
]

[rmk]
combo_max_num = 32
combo_max_length = 4
debounce_time = 5
morse_max_num = 32
max_patterns_per_key = 4

[host]
vial_enabled = true
unlock_keys = [[0, 0], [0, 1]]

[ble]
enabled = true
battery_adc_pin = "vddh"

[storage]
enabled = true
clear_storage = true

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
[split.central.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P1_06", "P0_02", "P0_29", "P0_31"]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
[split.peripheral.matrix]
bootmagic = [0, 0]
matrix_type = "normal"
col_pins = ["P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P1_06", "P0_02", "P0_29", "P0_31"]
