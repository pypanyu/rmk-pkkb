 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "Orbit34"
product_name = "Orbit34"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "rmk"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "PIO1", tx_pin = "PIN_1", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_0", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
serial = [{ instance = "PIO1", tx_pin = "PIN_1", rx_pin = "PIN_1" }]
    
[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [
    ["PIN_3", "PIN_4", "PIN_29", "PIN_26", "PIN_23"],
    ["PIN_2", "PIN_5", "PIN_28", "PIN_22", "PIN_21"],
    ["PIN_0", "PIN_6", "PIN_27", "PIN_20", "PIN_7"],
    ["_", "_", "_", "PIN_8", "PIN_9"],
]
bootmagic = [0, 0]

# 三元层：同时按住 Lower(层1) 与 Raise(层2) 时自动叠加进入层3(Adjust)
[behavior]
tri_layer = { lower = 1, upper = 2, adjust = 3 }

[layout]
# RMK split 约定：rows/cols 为整把键盘的总行列数（左半5列 + 右半5列 = 10）
rows = 4
cols = 10
layers = 8
keymap = [
    [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Enter"],
        ["Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Delete"],
        ["_", "_", "_", "LT(1, LShift)", "Space", "LT(2, Space)", "RAlt", "_", "_", "_"],
    ],
    [
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"],
        ["WM(1, LShift)", "WM(2, LShift)", "WM(3, LShift)", "WM(4, LShift)", "WM(5, LShift)", "WM(6, LShift)", "WM(7, LShift)", "WM(8, LShift)", "WM(9, LShift)", "WM(0, LShift)"],
        ["Minus", "WM(Minus, LShift)", "WM(Equal, LShift)", "Equal", "LeftBracket", "RightBracket", "Backslash", "Semicolon", "WM(Semicolon, LShift)", "Backspace"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_", "_", "_"],
    ],
    [
        ["Grave", "WM(Grave, LShift)", "WM(1, LShift)", "WM(2, LShift)", "WM(3, LShift)", "WM(4, LShift)", "WM(5, LShift)", "WM(6, LShift)", "WM(7, LShift)", "WM(8, LShift)"],
        ["WM(9, LShift)", "WM(0, LShift)", "LeftBracket", "RightBracket", "WM(LeftBracket, LShift)", "WM(RightBracket, LShift)", "Minus", "WM(Minus, LShift)", "Equal", "WM(Equal, LShift)"],
        ["Semicolon", "WM(Semicolon, LShift)", "Quote", "WM(Quote, LShift)", "Comma", "Slash", "Backslash", "WM(Slash, LShift)", "WM(Backslash, LShift)", "Backspace"],
        ["_", "_", "_", "LShift", "Space", "_", "RAlt", "_", "_", "_"],
    ],
    [
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["TO(0)", "MO(1)", "MO(2)", "MO(4)", "MO(5)", "MO(6)", "MO(7)", "_", "_", "_"],
        ["Bootloader", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "TO(0)", "RAlt", "_", "_", "_"],
    ],
    [
        ["Home", "PageUp", "PageDown", "End", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "Left", "Down", "Up", "Right", "Enter"],
        ["_", "_", "_", "_", "_", "Delete", "Insert", "Backspace", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_", "_", "_"],
    ],
    [
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["MouseBtn1", "MouseUp", "MouseBtn2", "MouseWheelUp", "_", "MediaPrevTrack", "AudioVolDown", "AudioVolUp", "MediaNextTrack", "MediaPlayPause"],
        ["MouseLeft", "MouseDown", "MouseRight", "MouseWheelDown", "_", "AudioMute", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_", "_", "_"],
    ],
    [
        ["Escape", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9"],
        ["Grave", "F10", "F11", "F12", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_", "_", "_"],
    ],
    [
        ["Grave", "WM(Grave, LShift)", "WM(9, LShift)", "WM(0, LShift)", "LeftBracket", "RightBracket", "WM(LeftBracket, LShift)", "WM(RightBracket, LShift)", "WM(Comma, LShift)", "WM(Dot, LShift)"],
        ["WM(2, LShift)", "WM(3, LShift)", "WM(4, LShift)", "WM(5, LShift)", "WM(6, LShift)", "WM(7, LShift)", "WM(8, LShift)", "Minus", "WM(Minus, LShift)", "_"],
        ["WM(Equal, LShift)", "Equal", "Backslash", "WM(Backslash, LShift)", "Slash", "WM(Slash, LShift)", "Semicolon", "WM(Semicolon, LShift)", "Quote", "WM(Quote, LShift)"],
        ["_", "_", "_", "LShift", "Space", "MO(2)", "RAlt", "_", "_", "_"],
    ],
]

[rmk]
# Maximum number of combos keyboard can store
combo_max_num = 25
# Maximum number of keys pressed simultaneously in a combo
combo_max_length = 4
# Default debounce time in milliseconds  
debounce_time = 5
morse_max_num = 32
# Maximum number of patterns a morse key can handle (default: 8, min: 4, max 65536)
max_patterns_per_key = 4
# Macro space size in bytes for storing sequences. The maximum number of Macros depends on the size of each sequence: All sequences combined need to fit into macro_space_size, the number of macro sequences doesn't matter.

[host]
# Enable or disable Vial support (default: true)
vial_enabled = true

# Unlock keys for Vial security (optional)
# Keys must be pressed simultaneously to unlock Vial configuration
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)
