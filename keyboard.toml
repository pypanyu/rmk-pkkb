[keyboard]
name = "velvet"
product_name = "velvet"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "pkk"
chip = "rp2040"

[layout]
rows = 4
cols = 10
layers = 8
matrix_map = """
(0, 0, L) (0, 1, L) (0, 2, L) (0, 3, L) (0, 4, L)    (0, 5, R) (0, 6, R) (0, 7, R) (0, 8, R) (0, 9, R)
(1, 0, L) (1, 1, L) (1, 2, L) (1, 3, L) (1, 4, L)    (1, 5, R) (1, 6, R) (1, 7, R) (1, 8, R) (1, 9, R)
(2, 0, L) (2, 1, L) (2, 2, L) (2, 3, L) (2, 4, L)    (2, 5, R) (2, 6, R) (2, 7, R) (2, 8, R) (2, 9, R)
          (3, 1, L) (3, 2, L) (3, 3, L) (3, 4, L)    (3, 5, R) (3, 6, R) (3, 7, R) (3, 8, R)
"""

[[layer]]
name = "base_layer"
keys = """
Q     W      E      R      T            Y      U      I      O      P
A     S      D      F      G            H      J      K      L      ENTER
Z     X      C      V      B            M      N      COMMA  DOT    SLASH
    LCTL    LALT   LSFT   MO(1)        MO(2)  SPACE  RALT   DEL
"""

[storage]
# clear_storage = true
# clear_layout = true

[split]
connection = "serial"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "normal"
# Default diode direction is col2row; set `row2col = true` if needed.
row2col = true
row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13"]
# Hold the key at (row=0,col=0) during boot to drop into the RP2040 bootloader.
bootmagic = [0, 0]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.peripheral.matrix]
matrix_type = "normal"
row2col = true
row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13"]
bootmagic = [0, 0]

[rmk]
split_peripherals_num = 1

[host]
unlock_keys = [[0, 0], [0, 1]]

[behavior.morse]
enable_flow_tap = true
unilateral_tap = true
permissive_hold = true
