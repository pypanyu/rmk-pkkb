 #Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "split45rmk"
product_name = "split45rmk"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "kong"
chip = "nrf52840"

