    # Layer 1 (Left half only)
    [
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "Equal", "Backspace"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
