# RMK Keyboard Firmware Configuration - pkkb velvet

# Version: v0.8.0 (Latest)

# Updated: 2026-09-15

# ============================================================================

[keyboard]
name = "velvet"
product_name = "velvet"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "pkk"
chip = "rp2040"

# ============================================================================

# 矩阵配置（分割键盘时由 \[split] 覆盖，此处注释掉）

# ============================================================================

#[matrix]

# matrixtype = "normal"

# row2col = true

# row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]

# col_pins = ["PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13"]

# ============================================================================

# 布局定义 - 物理布局（必需）

# ============================================================================

[layout]
rows = 4
cols = 10  # 左5列 + 右5列

# 布局映射：定义每个按键的位置

# 注意：这个顺序必须与 keymap.layer.keys 中的顺序一致

map = """
(0, 0, L)  (0, 1, L)  (0, 2, L)  (0, 3, L)  (0, 4, L)    (0, 5, R)  (0, 6, R)  (0, 7, R)  (0, 8, R)  (0, 9, R)
(1, 0, L)  (1, 1, L)  (1, 2, L)  (1, 3, L)  (1, 4, L)    (1, 5, R)  (1, 6, R)  (1, 7, R)  (1, 8, R)  (1, 9, R)
(2, 0, L)  (2, 1, L)  (2, 2, L)  (2, 3, L)  (2, 4, L)    (2, 5, R)  (2, 6, R)  (2, 7, R)  (2, 8, R)  (2, 9, R)
(3, 3, L)  (3, 4, L)    (3, 5, R)  (3, 6, R)
"""

# ============================================================================

# 按键映射 - 逻辑层定义（关键部分）

# 新版本使用 \[\[keymap.layer]] 而非 \[\[layer]]

# ============================================================================

[keymap]
layers = 3  # 总共 3 层

# 第 0 层 - 基础层

[[keymap.layer]]
name = "base_layer"
keys = """
Q W E R T    Y U I O P
A S D F G    H J K L Enter
Z X C V B    N M Comma Period Slash
LCtrl LShift    Space RShift
"""

# 第 1 层 - 功能层 1

[[keymap.layer]]
name = "fn_layer_1"
keys = """
F1 F2 F3 F4 F5    F6 F7 F8 F9 F10
1 2 3 4 5    6 7 8 9 0
Grave Minus Equal LBracket RBracket    Semicolon Apostrophe Backslash Slash Backspace
Trns Trns    Trns Trns
"""

# 第 2 层 - 功能层 2（鼠标/导航层）

[[keymap.layer]]
name = "fn_layer_2"
keys = """
Home PageUp Up PageDown Delete    Insert Home End Delete Backspace
Left Down Right Up PgUp    PgDn Left Down Right Enter
Undo Cut Copy Paste Redo    Trns Trns Trns Trns Trns
Trns Trns    Trns Trns
"""

# ============================================================================

# 别名定义（可选）

# ============================================================================

[aliases]

# MO(1) = "MO(1)"  # Momentary Layer 1

# MO(2) = "MO(2)"  # Momentary Layer 2

# ============================================================================

# 分割键盘配置（重要：此配置覆盖 \[matrix] 配置）

# ============================================================================

[split]
connection = "serial"
split_peripherals_num = 1  # 1 个外设（右半边）

# 中央控制器（左半边）

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

# 中央控制器的矩阵定义

[split.central.matrix]
matrix_type = "normal"
row2col = true
row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13"]
bootmagic = [0, 0]

# 中央控制器的串口配置

[[split.central.serial]]
instance = "UART0"
tx_pin = "PIN_0"
rx_pin = "PIN_1"
baud_rate = 115200

# 外设配置（右半边）

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5  # 列偏移为 5（因为左半边占 0-4 列）

# 外设的矩阵定义

[split.peripheral.matrix]
matrix_type = "normal"
row2col = true
row_pins = ["PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13"]
bootmagic = [0, 0]

# 外设的串口配置

[[split.peripheral.serial]]
instance = "UART0"
tx_pin = "PIN_0"
rx_pin = "PIN_1"
baud_rate = 115200

# ============================================================================

# 存储配置（可选）

# ============================================================================

[storage]

# enabled = true  # 默认启用，可在此配置

# clear\_storage = false  # 不在编译时清除存储

# ============================================================================

# 行为配置 - Combo、Tap-Hold 等高级功能

# ============================================================================

[behavior]

# 可在此添加 combo、tap-hold 等配置

# 详见官方文档

# ============================================================================

# 主机工具配置 - Vial 支持

# ============================================================================

[host]

# 启用 Vial 支持

# insecure = false  # 生产环境建议使用 false

# unlock\_keys = \["MO(2)", "LShift"]

# ============================================================================

# RMK 内部配置 - 性能与资源调优

# ============================================================================

[rmk]
split_peripherals_num = 1
combo_max_num = 25
combo_max_length = 4
debounce_time = 15  # 单位：毫秒
morse_max_num = 32
max_patterns_per_key = 4

# ============================================================================

# 事件配置（可选 - 事件队列大小调优）

# ============================================================================

[event]

# matrix\_event\_channel\_size = 128

# keyboard\_event\_channel\_size = 256

# ============================================================================

# 照明配置（如需 LED 指示灯）

# ============================================================================

# \[light]

# capslock.pin = "PIN\_14"

# scrolllock.pin = "PIN\_15"

# numlock.pin = "PIN\_16"

# ============================================================================

# 配置说明

# ============================================================================

#

# 1. 关键变化（RMK v0.8.0）：

# - 使用 \[\[keymap.layer]] 替代 \[\[layer]]

# - layout.map 和 keymap.layer.keys 必须顺序一致

# - 按键坐标使用 (row, col, hand) 格式

# - hand 标记：L（左）、R（右）、\*（双手）

#

# 2. 分割键盘架构：

# - central：中央控制器（处理 USB、BLE、输入等）

# - peripheral：从设备（仅扫描矩阵并通过串口发送）

# - 通过 split\_peripherals\_num 设置从设备数量

#

# 3. 串口通信参数：

# - 波特率：115200 bps（官方推荐）

# - TX/RX 引脚必须与硬件设计对应

# - 中央和外设都需配置相同的串口参数

#

# 4. 按键映射语法：

# - MO(n)：按住时激活第 n 层

# - LT(n, key)：按住激活第 n 层，轻按发送 key

# - TT(n)：轻按切换第 n 层，按住激活

# - TG(n)：切换第 n 层开/关

# - TO(n)：切换到第 n 层并关闭其他层

# - OSL(n)：一次性激活第 n 层

# - Trns 或 \_：透传至下层

# - No：无操作

#

# 5. 位置对应关系：

# 左手：(0-3, 0-4) → col\_offset = 0

# 右手：(0-3, 5-9) → col\_offset = 5

#

# ============================================================================
