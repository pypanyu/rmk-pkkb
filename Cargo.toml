[package]
name = "toykit-dongle"
version = "0.1.0"
authors = ["rmk"]
description = "Toykit v2 firmware with BLE dongle + bongocat OLED"
edition = "2024"
license = "MIT OR Apache-2.0"

# Library so the custom renderer can be referenced from keyboard.toml as
# `toykit_dongle::BongoCatRenderer`.
[lib]
name = "toykit_dongle"
path = "src/lib.rs"

[dependencies]
# NOTE: the `display` + `ssd1306` features enable the OLED; they require a
# recent RMK (>= 0.8, or `main`). Pin to a tag/rev that has them if needed.
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "f8da2742971d048e0080e57d69d98f00a859e4e9", default-features = false, features = [
    "defmt",
    "storage",
    "vial",
    "watchdog",
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
    "display",
    "ssd1306",
] }

# Custom renderer dependencies (embedded-graphics primitives + heapless strings).
embedded-graphics = "0.8"
heapless = "0.9"

# nRF52 BLE stack (same as the RMK nrf52840 split example).
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Three firmware images: dongle (central) + two keyboard halves.
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[[bin]]
name = "peripheral2"
path = "src/peripheral2.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
