# 整体替换仓库根目录的 Cargo.toml
# 关键修复：rmk 钉到 tkv2 已验证的 rev f8da274，并把 nrf-sdc / nrf-mpsl /
# bt-hci 切到 alexmoon 的 nrf-sdc fork。这套 fork 修了 nrf-mpsl-sys v0.3.0
# build.rs 在 x86_64 上 panic 的问题（build.rs 第 126 行写死"Unsupported
# target: x86_64-unknown-linux-gnu"），是 dongle 路线的关键补丁层。
[package]
name = "totem"
version = "0.1.0"
edition = "2024"
description = "Totem split keyboard + BLE dongle firmware (RMK)"

[dependencies]
# rmk git 钉 rev：f8da274 是 tkv2-dongle 已验证编译通过的版本，
# 包含 dongle feature 和 rmk::dongle 模块（rmk main 的 dongle feature
# 还有 trouble-host?/central + ?/scan，是 f8da274 的超集但本工程不需要）。
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "f8da2742971d048e0080e57d69d98f00a859e4e9", default-features = false, features = [
    "defmt",
    "storage",
    "vial",        # Vial 透传：dongle 和键盘两侧都要开 vial，才能通过接收器配置
    "watchdog",
    "nrf52840_ble",
    "split",       # 分体键盘（central/peripheral）
    "dongle",      # 键盘侧获得独立绑定槽 + SwitchToDongle(User8)；dongle 侧解锁 rmk::dongle
    "async_matrix",
    "adafruit_bl", # Bootmagic 键真正跳进 Adafruit UF2 bootloader
] }

# ── Nordic BLE 栈（关键：必须来自 alexmoon 的 fork，crates.io 版本会
#    在 nrf-mpsl-sys v0.3.0 的 build.rs 里 panic）──
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
# bt-hci 必须锁 0.9 系列，与 alexmoon fork 配套；rmk f8da274 默认拉 0.10
# 会触发类型不兼容编译错误
bt-hci = { version = "0.9", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = [
    "tick-hz-32_768",
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",   # MPSL 占用 RTC0/TIMER0，embassy 计时必须用 RTC1
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",   # P0_09/P0_10 默认是 NFC 复用脚，矩阵用了它们必须开
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# ── 三个固件目标：烧到三块板上（每个只定义一次）──
[[bin]]
name = "central"     # 左半（分体中央端）
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"  # 右半（分体外设端）
path = "src/peripheral.rs"
test = false
bench = false

[[bin]]
name = "dongle"      # USB 接收器（第三块板）
path = "src/dongle.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
