# 整体替换仓库根目录的 Cargo.toml
[package]
name = "totem"
version = "0.1.0"
edition = "2024"
description = "Totem split keyboard + BLE dongle firmware (RMK)"

[dependencies]
# dongle 支持（rmk::dongle 模块、键盘侧独立绑定槽 + SwitchToDongle）
# 只在 git main 上有，crates.io 的 0.9.0 没有，必须钉 rev。
# rev = rmk main 2026-09-09（34d1a5e），已核对 dongle/UsbTransport/storage API 均存在。
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "34d1a5eedf8afd17128cf25ed839adab6475d404", default-features = false, features = [
    "defmt",
    "storage",
    "vial",        # Vial 透传：dongle 和键盘两侧都要开 vial，才能通过接收器配置
    "watchdog",
    "nrf52840_ble",
    "split",       # 分体键盘（central/peripheral）
    "dongle",      # 键盘侧获得独立绑定槽 + SwitchToDongle(User8)；dongle 侧解锁 rmk::dongle。
                   # 该 feature 已自动启用 trouble-host 的 central/scan 等特性，
                   # 不再需要手动加 trouble-host 依赖（那是 rmk 0.9.0 的坑，git main 已修）
    "async_matrix",
    "adafruit_bl", # Bootmagic/Bootloader 键真正跳进 Adafruit UF2 bootloader
] }

nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = [
    "tick-hz-32_768",
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",   # MPSL 占用 RTC0/TIMER0，embassy 计时必须用 RTC1
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",   # P0_09/P0_10 默认是 NFC 复用脚，矩阵用了它们必须开
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# ── 三个固件目标：烧到三块板上（每个只定义一次）──
[[bin]]
name = "central"     # 左半（分体中央端）
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"  # 右半（分体外设端）
path = "src/peripheral.rs"
test = false
bench = false

[[bin]]
name = "dongle"      # USB 接收器（第三块板）
path = "src/dongle.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
