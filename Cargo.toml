[package]
name = "toykit-dongle"
version = "0.1.0"
authors = ["rmk"]
description = "Toykit v2 firmware with BLE dongle + bongocat OLED"
edition = "2024"
license = "MIT OR Apache-2.0"

# Library so the custom renderer can be referenced from keyboard.toml as
# `toykit_dongle::BongoCatRenderer`.
[lib]
name = "toykit_dongle"
path = "src/lib.rs"

[dependencies]
# NOTE: the `display` + `ssd1306` features enable the OLED; they require a
# recent RMK (>= 0.8, or `main`). Pin to a tag/rev that has them if needed.
#
# `nrf52840_ble` and `split` are RMK features that *transitively* enable
# `rmk-types/_ble` and `rmk-types/split` (and therefore expose the
# `RenderContext::ble_status` / `peripherals_connected` / `peripheral_batteries`
# fields that `bongocat.rs` reads). We mirror them as named feature stubs on
# *this* crate so the `#[cfg(feature = "_ble")]` / `#[cfg(feature = "split")]`
# gates inside `bongocat.rs` actually compile under the same condition that
# RMK uses to surface those fields — without this, `cargo check` would
# report "unexpected cfg condition value" warnings and `BleState` would be
# reported as unused (because the gated `transport_from_ctx` block would
# always be dead).
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "f8da2742971d048e0080e57d69d98f00a859e4e9", default-features = false, features = [
    "defmt",
    "storage",
    "vial",
    "watchdog",
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
    "display",
    "ssd1306",
] }
# Mirror RMK's `_ble` / `split` feature names as empty stubs so the
# `#[cfg(feature = "_ble")]` / `#[cfg(feature = "split")]` gates inside
# `bongocat.rs` are valid cfg values. They are enabled by default because
# this firmware only ever builds with `nrf52840_ble` + `split` on RMK
# (which transitively pulls the same features into `rmk-types`, exposing
# the corresponding `RenderContext` fields). If you build this crate with
# `--no-default-features`, the renderer silently falls back to the USB
# + Connected transport pill via the `cfg(not(...))` branches.

# Direct dep on rmk-types so we can match the `BatteryStatus` /
# `ChargeState` / `BleState` enums when bridging `RenderContext` to
# `DisplayEvent`. Pinned to the same commit as the `rmk` dep so cargo
# resolves to a single revision; the `_ble` + `split` features mirror
# what `rmk` enables transitively.
rmk-types = { git = "https://github.com/rmk-rs/rmk", rev = "f8da2742971d048e0080e57d69d98f00a859e4e9", features = [
    "_ble",
    "split",
] }

# Custom renderer dependencies (embedded-graphics primitives + heapless strings).
embedded-graphics = "0.8"
heapless = "0.9"

# Display rendering engine: ports the standalone dongle display stack from
# hitsmaxft/rmk-dongle-display into Toykit-v2.
#
# We pin a single commit and only enable `street-fighter` so the source
# crate pulls in its own embedded-graphics-core (0.4) but NOT its own `rmk`
# (the `rmk-display` feature is intentionally off, otherwise it would
# conflict with the Toykit-v2-pinned RMK rev). Animation is selected by
# feature; the two features are mutually exclusive at compile time inside
# the source crate:
#   * `street-fighter` -> character punching animation (current choice)
#   * `bongo-cat`      -> cat typing on bongo drums
dongle-display = {
    package = "rmk-dongle-display",
    git = "https://github.com/hitsmaxft/rmk-dongle-display",
    rev = "687cf0e026b74a1add66206c33d4a340d7ad10fb",
    default-features = false,
    features = ["street-fighter"],
}

# nRF52 BLE stack (same as the RMK nrf52840 split example).
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

# `_ble` / `split` are mirror stubs of RMK's feature names (see top-of-file
# comment on `rmk`). They make `#[cfg(feature = "_ble")]` /
# `#[cfg(feature = "split")]` valid inside this crate.
[features]
default = ["_ble", "split"]
_ble = []
split = []

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Three firmware images: dongle (central) + two keyboard halves.
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[[bin]]
name = "peripheral2"
path = "src/peripheral2.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
